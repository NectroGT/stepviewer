<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Everything loads from this site only, and the page may not connect anywhere else,
     so an opened model cannot be sent off the device. ('unsafe-eval' is needed by the
     Open CASCADE engine's generated bindings; it does not allow any network access.) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171f28" media="(prefers-color-scheme: dark)">
<meta name="description" content="Open STEP files on your phone, browse the part tree, and measure part sizes, hole diameters and distances. Files stay on your device.">
<title>Pocket STEP Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l9 5v10l-9 5-9-5V7z' fill='%231f5fd1'/%3E%3Cpath d='M12 12l9-5M12 12v10M12 12L3 7' stroke='%23fff' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-screen app. Header bar / full-bleed 3D viewport / mode bar.
   Readouts float over the bottom of the viewport; parts tree is a slide-in drawer. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --fg: #16202a;
  --muted: #5b6876;
  --line: #d3dae1;
  --accent: #1f5fd1;      /* layout-dye blue */
  --accent-fg: #ffffff;
  --accent-soft: #e3ecfb;
  --mark: #e0560b;        /* measurement marks */
  --viewport: #dde3e9;
  --edge: #2b3742;
  --shadow: 0 6px 24px rgba(22, 32, 42, .14);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1318; --surface: #171f28; --surface-2: #1d2631; --fg: #e5eaef; --muted: #8d9aa8;
    --line: #2a3542; --accent: #5c9bff; --accent-fg: #0b1220; --accent-soft: #1b2b45;
    --mark: #ff8a3d; --viewport: #131a22; --edge: #0a0e12; --shadow: 0 6px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #171f28; --surface-2: #1d2631; --fg: #e5eaef; --muted: #8d9aa8;
  --line: #2a3542; --accent: #5c9bff; --accent-fg: #0b1220; --accent-soft: #1b2b45;
  --mark: #ff8a3d; --viewport: #131a22; --edge: #0a0e12; --shadow: 0 6px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
html { color-scheme: light; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
  width: 100%; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* header */
.bar {
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.bar > .btn { flex: none; }
@media (max-width: 420px) {
  .bar { gap: 8px; }
  .btn { padding: 0 10px; }
  #partsBtn .lbl, #openBtn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .brand h1 { font-size: 16px; }
}
.brand h1 { margin: 0; font: 600 17px/1.1 var(--font-head); letter-spacing: .01em; }
.brand .file { font: 400 12px/1.3 var(--font-num); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2);
  font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:focus-visible, .mode:focus-visible, .row button:focus-visible, .views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; }
.unit { font-family: var(--font-num); min-width: 46px; justify-content: center; }

/* viewport */
.stage { position: relative; min-height: 0; background: var(--viewport); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.chip {
  position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px));
  max-width: calc(100% - 90px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; box-shadow: var(--shadow); font-size: 12px; color: var(--muted);
}
.chip b { display: block; font: 500 14px/1.3 var(--font-num); color: var(--fg); font-variant-numeric: tabular-nums; }
.views {
  position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 6px;
}
.views button {
  width: 44px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); box-shadow: var(--shadow); font: 500 11px/1 var(--font-num);
  letter-spacing: .04em; cursor: pointer;
}
.label3d {
  position: absolute; transform: translate(-50%, -130%); pointer-events: none;
  background: var(--mark); color: #fff; font: 500 13px/1 var(--font-num);
  padding: 5px 7px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums;
}

.readout {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 8px;
  max-width: 460px; margin-inline: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 8px 10px 9px 12px; display: grid; gap: 3px;
}
.readout .head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.readout .kind { font: 600 11px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.readout .name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.readout .more { flex: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 6px; font-size: 12px; font-weight: 500; padding: 4px 8px; cursor: pointer; }
.readout .more:focus-visible, .readout .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.readout:not(.open) .kv { display: none; }
.readout .kv { margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
.readout .x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 4px; cursor: pointer; }
.big { font: 500 18px/1.2 var(--font-num); font-variant-numeric: tabular-nums; }
.big small { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 12px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.hint { color: var(--muted); font-size: 13px; }

/* mode bar */
.modes {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.mode {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px;
  border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer;
}
.mode svg { width: 22px; height: 22px; }
.mode[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* parts drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 16, .4); z-index: 20; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(88vw, 380px); z-index: 21;
  background: var(--surface); border-right: 1px solid var(--line); box-shadow: var(--shadow);
  display: grid; grid-template-rows: auto auto 1fr;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  transform: translateX(-102%); transition: transform .22s ease;
}
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; flex: 1; font: 600 16px/1 var(--font-head); }
.drawer .tools { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.drawer .tools .btn { height: 32px; font-size: 13px; }
.tree { overflow: auto; padding: 6px 0 24px; -webkit-overflow-scrolling: touch; }
.tree details > summary { list-style: none; }
.tree details > summary::-webkit-details-marker { display: none; }
.row {
  display: flex; align-items: center; gap: 6px; min-height: 40px; padding-right: 10px;
  cursor: pointer; border-left: 3px solid transparent;
}
.row.sel { background: var(--accent-soft); border-left-color: var(--accent); }
.row input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
.row .caret { width: 16px; flex: none; color: var(--muted); font-size: 11px; text-align: center; transition: transform .15s; }
details[open] > summary .caret { transform: rotate(90deg); }
.row .nm { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ct { font: 400 11px var(--font-num); color: var(--muted); }
.row button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; font-size: 11px; padding: 4px 7px; cursor: pointer; color: var(--muted); }
.row.asm .nm { font-weight: 600; }

/* loading / empty */
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--viewport) 80%, transparent); z-index: 5; text-align: center;
}
.overlay .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); max-width: 320px; display: grid; gap: 8px; }
.spin { width: 28px; height: 28px; margin: 0 auto; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: sp 0.9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.err { color: var(--mark); font-weight: 500; }
.start-icon { width: 48px; height: 48px; margin: 0 auto; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.start-icon svg { width: 28px; height: 28px; }
.start-title { margin: 4px 0 0; font: 600 20px/1.2 var(--font-head); text-wrap: balance; }
.start-btn { justify-self: center; height: 44px; padding: 0 20px; font-size: 15px; margin-top: 4px; }
.start-note { font-size: 12px; }
.drop { outline: 3px dashed var(--accent); outline-offset: -8px; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="btn" id="partsBtn" aria-label="Show parts list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
      <span class="lbl">Parts</span>
    </button>
    <div class="brand">
      <h1>Pocket STEP Viewer</h1>
      <span class="file" id="fileName">No file</span>
    </div>
    <button class="btn unit" id="unitBtn" aria-label="Switch units">mm</button>
    <button class="btn primary" id="openBtn" aria-label="Open a STEP file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5h6l2 2h8v12z"/></svg>
      <span class="lbl">Open</span>
    </button>
    <input type="file" id="fileInput" hidden>
  </header>

  <main class="stage" id="stage">
    <div class="chip" id="chip" hidden><span id="chipLabel">Overall size</span><b id="chipSize"></b></div>
    <div class="views">
      <button data-view="fit" aria-label="Fit model">FIT</button>
      <button data-view="iso" aria-label="Iso view">ISO</button>
      <button data-view="top" aria-label="Top view">TOP</button>
      <button data-view="front" aria-label="Front view">FRT</button>
      <button data-view="right" aria-label="Right view">RGT</button>
    </div>
    <div class="label3d" id="label3d" hidden></div>
    <section class="readout" id="readout" aria-live="polite"></section>
    <div class="overlay" id="overlay">
      <div class="card" id="overlayText"><div class="spin"></div><div>Loading…</div></div>
    </div>
  </main>

  <nav class="modes" aria-label="Tap mode">
    <button class="mode" data-mode="part" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
      Part size
    </button>
    <button class="mode" data-mode="face" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg>
      Face / hole
    </button>
    <button class="mode" data-mode="dist" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>
      Distance
    </button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Parts">
  <header>
    <h2>Parts</h2>
    <button class="btn" id="closeDrawer" aria-label="Close parts list">Close</button>
  </header>
  <div class="tools">
    <button class="btn" id="showAll">Show all</button>
    <button class="btn" id="hideAll">Hide all</button>
  </div>
  <div class="tree" id="tree"></div>
</aside>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="occt-import-js.js"></script>
<script src="app.js"></script>
</body>
</html>
