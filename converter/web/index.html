<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF to STEP</title>
<link rel="icon" type="image/png" href="/web/logo.png">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #dde2e8;
  --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef3c7;
  --bad: #b91c1c; --bad-bg: #fee2e2; --idle-bg: #eef1f4; --viewer: #eef1f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1a1e24; --text: #e6e9ed; --muted: #97a1ad; --line: #2c323a;
    --accent: #4f8cff; --accent-text: #0b1220; --ok: #4ade80; --ok-bg: #14301f; --warn: #fbbf24; --warn-bg: #33290f;
    --bad: #f87171; --bad-bg: #3a1717; --idle-bg: #232930; --viewer: #161a1f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 24px 8px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 2px; display: flex; align-items: center; gap: 10px; }
h1 img { width: 36px; height: 36px; }
header p { margin: 0; color: var(--muted); }
main { max-width: 1280px; margin: 0 auto; padding: 12px 24px 48px; }

#drop { border: 2px dashed var(--line); border-radius: 12px; background: var(--panel); padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
#drop.over { border-color: var(--accent); }
#drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
#drop span { color: var(--muted); }

button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover, .btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
.btn.off { opacity: .5; cursor: default; }
.btn.off:hover { border-color: var(--line); }
select, input[type=number] { font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
input[type=number] { width: 64px; }

#bar { display: none; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
#bar .name { font-weight: 600; overflow-wrap: anywhere; }
#bar .grow { flex: 1; }
#progress { height: 6px; background: var(--idle-bg); border-radius: 3px; overflow: hidden; flex-basis: 100%; }
#progress div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
#summary { color: var(--muted); }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }

#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card.dim { opacity: .62; }
.thumb { background: #fff; aspect-ratio: 1.414; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); cursor: zoom-in; }
.thumb img { max-width: 100%; max-height: 100%; display: block; }
.body { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title { font-weight: 600; }
.badge { font-size: 12.5px; padding: 2px 8px; border-radius: 99px; background: var(--idle-bg); color: var(--muted); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.info { color: var(--muted); font-size: 13.5px; }
.err { color: var(--bad); font-size: 13.5px; overflow-wrap: anywhere; }
.parts { display: flex; flex-direction: column; gap: 8px; }
.part { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; }
.part .row { justify-content: space-between; }
.part ul { margin: 4px 0 0; padding-left: 18px; color: var(--warn); }
.spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: s .8s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
details summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }

#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#modal .box { background: var(--panel); border-radius: 12px; width: min(1000px, 100%); height: min(720px, 100%); display: flex; flex-direction: column; overflow: hidden; }
#modal .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
#modal .head .grow { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
.stage { flex: 1; display: flex; min-height: 0; }
#view3d { flex: 1; background: var(--viewer); position: relative; min-height: 0; min-width: 0; }
#ref { width: 34%; max-width: 360px; margin: 0; padding: 12px; border-left: 1px solid var(--line); display: none; flex-direction: column; gap: 8px; background: var(--panel); }
#ref img { width: 100%; height: auto; max-height: calc(100% - 48px); object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
#ref figcaption { color: var(--muted); font-size: 12.5px; }
@media (max-width: 700px) { .stage { flex-direction: column; } #ref { width: auto; max-width: none; border-left: 0; border-top: 1px solid var(--line); max-height: 40%; } #ref img { max-height: 100%; } }
#view3d canvas { display: block; }
#view3d .hint { position: absolute; left: 12px; bottom: 8px; color: var(--muted); font-size: 12.5px; pointer-events: none; }
#modal img.page { max-width: 100%; max-height: 100%; margin: auto; display: block; background: #fff; }
@media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1><img src="/web/logo.png" alt="">PDF to STEP</h1>
  <p>Upload a CAD drawing (vector PDF). Every page is scanned for plate-type parts that can be built in 3D.</p>
</header>
<main>
  <div id="drop">
    <strong>Drop a PDF here or click to choose one</strong>
    <span>The whole file is scanned; pages with a plan view and a lined-up side view are marked usable.</span>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </div>

  <div id="bar">
    <span class="name" id="fname"></span>
    <span id="summary"></span>
    <span class="grow"></span>
    <label class="chk"><input type="checkbox" id="onlyUsable"> usable pages only</label>
    <button class="primary" id="convertAll" disabled>Convert all usable pages</button>
    <a class="btn off" id="zip" href="#" aria-disabled="true">Download all STEP</a>
    <button id="newFile">New file</button>
    <div id="progress"><div></div></div>
  </div>

  <div id="grid"></div>
</main>

<div id="modal">
  <div class="box">
    <div class="head"><span class="grow" id="mtitle"></span><a class="btn" id="mview" href="#" target="_blank" rel="noopener" style="display:none">Open in viewer</a><a class="btn" id="mdl" href="#">Download STEP</a><button id="mclose">Close</button></div>
    <div class="stage">
      <div id="view3d"></div>
      <figure id="ref"><img alt="3D view from the drawing"><figcaption>As drawn on the sheet - for comparison only, not used to build the model.</figcaption></figure>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (s) => document.querySelector(s);
let job = null, timer = null;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ------------------------------------------------ upload
const drop = $("#drop"), file = $("#file");
drop.onclick = () => file.click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
file.onchange = () => file.files[0] && upload(file.files[0]);

async function upload(f) {
  drop.querySelector("strong").textContent = "Uploading " + f.name + " ...";
  const fd = new FormData(); fd.append("pdf", f);
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  const d = await r.json();
  if (!r.ok) { drop.querySelector("strong").textContent = d.error || "Upload failed"; return; }
  history.replaceState(null, "", "#" + d.id);
  start(d.id);
}

function start(id) {
  drop.style.display = "none"; $("#bar").style.display = "flex"; $("#grid").innerHTML = "";
  $("#zip").href = `/api/job/${id}/all.zip`;
  job = { id }; poll();
}

$("#newFile").onclick = () => { clearTimeout(timer); job = null; history.replaceState(null, "", "#"); location.reload(); };
$("#onlyUsable").onchange = () => job && render(job);
$("#convertAll").onclick = () => post({ pages: "usable" });
$("#zip").onclick = (e) => { if ($("#zip").classList.contains("off")) e.preventDefault(); };

// released (after the click has fired): let the cards catch up with status updates held back meanwhile
const release = () => setTimeout(() => {
  document.querySelectorAll(".card.held").forEach((c) => c.classList.remove("held"));
  if (job && job.pages) render(job);
});
document.addEventListener("pointerup", release);
document.addEventListener("pointercancel", release);

async function post(body) {
  await fetch(`/api/job/${job.id}/convert`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  clearTimeout(timer); poll();
}

async function poll() {
  const r = await fetch(`/api/job/${job.id}`);
  if (!r.ok) { $("#summary").textContent = "This upload is no longer on the server - upload the file again."; return; }
  job = await r.json(); render(job);
  const busy = !job.scanned || job.pages.some((p) => ["queued", "converting"].includes(p.convert));
  clearTimeout(timer); // a click's poll() may overlap the regular one: keep a single timer going
  timer = setTimeout(poll, busy ? 1000 : 5000);
}

// ------------------------------------------------ page cards
const cards = {};
function render(j) {
  $("#fname").textContent = j.name;
  const n = j.pages.length, scanned = j.pages.filter((p) => !["waiting", "scanning"].includes(p.scan)).length;
  const usable = j.pages.filter((p) => p.scan === "usable").length;
  const converting = j.pages.filter((p) => ["queued", "converting"].includes(p.convert)).length;
  const done = j.pages.filter((p) => p.convert === "done").length;
  let s = j.scanned ? `${usable} of ${n} pages usable` + (j.scan_time ? ` (scanned in ${Math.round(j.scan_time)} s)` : "")
                    : `Scanning ... ${scanned} of ${n} pages done, ${usable} usable so far`;
  if (converting) s += ` · converting ${converting} page(s)`;
  else if (done) s += ` · ${done} converted`;
  $("#summary").textContent = s;
  const total = n + j.pages.filter((p) => p.convert).length;
  const prog = scanned + j.pages.filter((p) => ["done", "failed"].includes(p.convert)).length;
  $("#progress div").style.width = (100 * prog / Math.max(total, 1)) + "%";
  $("#convertAll").disabled = !usable || j.pages.every((p) => p.scan !== "usable" || p.convert);
  // all STEP files only once every usable page has been converted
  const allDone = j.scanned && usable > 0 && converting === 0 &&
                  j.pages.every((p) => p.scan !== "usable" || ["done", "failed"].includes(p.convert));
  const zip = $("#zip");
  zip.classList.toggle("off", !allDone);
  zip.setAttribute("aria-disabled", String(!allDone));
  zip.title = allDone ? "" : "Convert all usable pages first";
  const only = $("#onlyUsable").checked;
  for (const p of j.pages) {
    let c = cards[p.page];
    if (!c || c.dataset.job !== j.id) {
      c = document.createElement("div"); c.className = "card"; c.dataset.job = j.id;
      c.innerHTML = `<div class="thumb"><img loading="lazy" alt="page ${p.page}" src="/api/job/${j.id}/thumb/${p.page}.png"></div><div class="body"></div>`;
      c.querySelector(".thumb").onclick = () => showPage(p.page);
      c.addEventListener("pointerdown", () => c.classList.add("held"));
      c.addEventListener("focusout", () => setTimeout(() => job && job.pages && render(job))); // catch up after typing
      $("#grid").appendChild(c); cards[p.page] = c;
    }
    const key = JSON.stringify(p);
    // Rebuilding the card while a button is held down loses the click (it needs press and release on
    // the same button), and while you type a scale it would wipe what you typed: wait until you're done.
    if (c.dataset.key !== key && !c.matches(".held") && !c.contains(document.activeElement)) {
      const typed = c.querySelector(".scale")?.value;
      c.dataset.key = key; c.querySelector(".body").innerHTML = cardBody(p); wire(c, p);
      const sc = c.querySelector(".scale");
      if (sc && typed && !p.convert) sc.value = typed; // a scale typed but not yet used survives a status update
    }
    c.classList.toggle("dim", p.scan === "none" || p.scan === "error");
    c.style.display = only && p.scan !== "usable" && !p.convert ? "none" : "";
  }
}

function scanBadge(p) {
  if (p.scan === "waiting") return `<span class="badge">waiting</span>`;
  if (p.scan === "scanning") return `<span class="badge"><span class="spin"></span> scanning</span>`;
  if (p.scan === "usable") return `<span class="badge ${p.warn ? "warn" : "ok"}">usable · ${p.parts} part${p.parts > 1 ? "s" : ""}${p.warn ? " · check" : ""}</span>`;
  if (p.scan === "error") return `<span class="badge bad">could not read</span>`;
  return `<span class="badge">not usable</span>`;
}

function cardBody(p) {
  let h = `<div class="row"><span class="title">Page ${p.page}</span>${scanBadge(p)}</div>`;
  if (p.scan === "usable") {
    h += `<div class="info">${p.views} view${p.views === 1 ? "" : "s"} found` +
         (p.turned ? ` · ${p.turned} part${p.turned > 1 ? "s" : ""} drawn turned on the sheet` : "") + `</div>`;
    if (p.warn) h += `<div class="info" style="color:var(--warn)">${esc(p.warn)}</div>`;
  } else if (p.reason) {
    h += `<div class="${p.scan === "error" ? "err" : "info"}">${esc(p.reason)}</div>`;
  }
  const busy = ["queued", "converting"].includes(p.convert);
  if (p.scan !== "waiting" && p.scan !== "scanning") {
    const label = busy ? `<span class="spin"></span> ${p.convert === "queued" ? "queued" : "converting"}` : (p.convert ? "Convert again" : "Convert to 3D");
    const primary = p.scan === "usable" && !p.convert ? "primary" : "";
    h += `<div class="row"><button class="go ${primary}" ${busy ? "disabled" : ""}>${label}</button>` +
         `<span class="info">scale 1:</span><input type="number" class="scale" min="0" step="any" placeholder="auto" value="${p.scale || ""}" title="leave empty to read it from the title block"></div>`;
  }
  if (p.convert_error) h += `<div class="err">${esc(p.convert_error)}</div>`;
  if (p.parts_out && p.parts_out.length) {
    h += `<div class="parts">` + p.parts_out.map((r) => partBox(p, r)).join("") + `</div>`;
  }
  if (p.extra && p.extra.length) {
    h += `<details><summary>more from this page</summary><div class="info">` +
         p.extra.map((e) => esc(e.note || "") + " " + esc((e.views || e.details || []).join(", "))).join("<br>") + `</div></details>`;
  }
  return h;
}

// the STP viewer (../site in the stepviewer repo), served by app.py at /viewer/ when it is there
const VIEWER = document.documentElement.dataset.viewer === "1";
function viewerLink(page, name) {
  return "/viewer/?open=" + encodeURIComponent(`/api/job/${job.id}/file/${page}/${encodeURIComponent(name)}.step`);
}

// the check: the model's views against the drawing's (outlines and the lines inside them)
function checkBadge(p, r) {
  const c = r.check;
  if (!c) return "";
  if (c.error) return `<span class="badge" title="${esc("not checked: " + c.error)}">not checked</span>`;
  const per = Object.entries(c.views || {}).map(([v, x]) =>
    `${v}: outline ${(100 * x.overlap).toFixed(1)}%` + (x.edges != null ? `, lines ${(100 * x.edges).toFixed(0)}%` : "")).join("\n");
  const tip = (c.matched ? "The model's views match the drawing" : "The model's views differ from the drawing") +
              " (outline overlap, and the share of the drawing's lines the model has).\n" + per + "\nClick to see the comparison.";
  return `<button class="badge chkimg ${c.matched ? "ok" : "warn"}" data-name="${esc(r.name)}" title="${esc(tip)}" style="border:0">` +
         `${c.matched ? "✓ matches drawing" : "differs from drawing"}</button>`;
}

function partBox(p, r) {
  if (!r.built) return `<div class="part"><div class="row"><b>${esc(r.name)}</b><span class="badge bad">failed</span></div><div class="err">${esc(r.error)}</div></div>`;
  const sz = r.size_mm.map((v) => v.toFixed(1)).join(" × ");
  const facts = [`${sz} mm`, `${r.holes} hole${r.holes === 1 ? "" : "s"}`];
  if (r.side_holes) facts.push(`${r.side_holes} edge hole${r.side_holes === 1 ? "" : "s"}`);
  if (r.cuts) facts.push(`${r.cuts} cut-out${r.cuts === 1 ? "" : "s"}`);
  if (r.threads && r.threads.length) facts.push("threads " + r.threads.join(", "));
  facts.push("scale 1:" + r.scale);
  return `<div class="part"><div class="row"><span><b>${esc(r.name)}</b> ${checkBadge(p, r)}</span><span>
      <button class="v3d" data-name="${esc(r.name)}" data-ref="${esc(r.ref || "")}">View 3D</button>
      ${VIEWER ? `<a class="btn" href="${viewerLink(p.page, r.name)}" target="_blank" rel="noopener" title="Open in the STP viewer: measure, cut, weight">Open in viewer</a>` : ""}
      <a class="btn" href="/api/job/${job.id}/file/${p.page}/${encodeURIComponent(r.name)}.step" download title="Download the STEP file" aria-label="Download the STEP file"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg></a></span></div>
    <div class="info">${esc(facts.join(" · "))}</div>
    </div>`;
}

function wire(c, p) {
  const go = c.querySelector(".go");
  if (go) go.onclick = () => {
    // show it straight away; the next status update from the server takes over
    go.disabled = true; go.classList.remove("primary");
    go.innerHTML = `<span class="spin"></span> queued`;
    post({ pages: [p.page], scale: c.querySelector(".scale").value || null });
  };
  c.querySelectorAll(".v3d").forEach((b) => b.onclick = () => show3d(p.page, b.dataset.name, b.dataset.ref));
  c.querySelectorAll(".chkimg").forEach((b) => b.onclick = () =>
    showImage(`${b.dataset.name}: model (black) over the drawing (red)`, `/api/job/${job.id}/file/${p.page}/${encodeURIComponent(b.dataset.name)}_check.png`));
}

// ------------------------------------------------ viewers
const modal = $("#modal"), holder = $("#view3d");
let renderer = null, raf = 0, cam = null;
$("#mclose").onclick = closeModal;
modal.onclick = (e) => { if (e.target === modal) closeModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

function closeModal() {
  modal.style.display = "none"; cancelAnimationFrame(raf);
  if (renderer) { renderer.dispose(); renderer = null; }
  holder.innerHTML = "";
  $("#ref").style.display = "none";
}

function showPage(n) { showImage(`Page ${n}`, `/api/job/${job.id}/thumb/${n}.png`); }

function showImage(title, src) {
  closeModal();
  $("#mtitle").textContent = title; $("#mdl").style.display = "none"; $("#mview").style.display = "none";
  holder.innerHTML = `<img class="page" src="${src}">`;
  modal.style.display = "flex";
}

function show3d(page, name, ref) {
  closeModal();
  $("#mtitle").textContent = name; $("#mdl").style.display = "";
  $("#mdl").href = `/api/job/${job.id}/file/${page}/${encodeURIComponent(name)}.step`;
  if (VIEWER) { $("#mview").href = viewerLink(page, name); $("#mview").style.display = ""; }
  if (ref) {                       // the drawing's own 3D view, beside the model
    $("#ref img").src = `/api/job/${job.id}/file/${page}/${encodeURIComponent(ref)}`;
    $("#ref").style.display = "flex";
  }
  modal.style.display = "flex";
  holder.innerHTML = `<div class="hint">drag to turn · right-drag to move · scroll to zoom</div>`;
  const w = holder.clientWidth, h = holder.clientHeight;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(w, h);
  holder.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  cam = new THREE.PerspectiveCamera(35, w / h, 0.1, 1e5);
  cam.up.set(0, 0, 1);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(1, -1.5, 2); scene.add(sun);
  const controls = new OrbitControls(cam, renderer.domElement); controls.enableDamping = true;
  new STLLoader().load(`/api/job/${job.id}/file/${page}/${encodeURIComponent(name)}.stl`, (geo) => {
    geo.computeVertexNormals(); geo.computeBoundingBox();
    const box = geo.boundingBox, c = new THREE.Vector3(); box.getCenter(c);
    geo.translate(-c.x, -c.y, -c.z);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x9aa7b8, metalness: 0.35, roughness: 0.45 }));
    scene.add(mesh);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({ color: 0x334155 }));
    scene.add(edges);
    const size = box.getSize(new THREE.Vector3()).length();
    // isometric direction (front-right-top), the way drawings show their 3D views
    cam.position.set(size * 0.95, -size * 0.95, size * 0.95); cam.near = size / 100; cam.far = size * 20; cam.updateProjectionMatrix();
    controls.target.set(0, 0, 0); controls.update();
  }, undefined, () => { holder.innerHTML = `<div class="err" style="padding:16px">No 3D preview for this part - the STEP file can still be downloaded.</div>`; });
  const loop = () => { raf = requestAnimationFrame(loop); controls.update(); renderer && renderer.render(scene, cam); };
  loop();
}
window.addEventListener("resize", () => {
  if (!renderer) return;
  renderer.setSize(holder.clientWidth, holder.clientHeight);
  cam.aspect = holder.clientWidth / holder.clientHeight; cam.updateProjectionMatrix();
});

// reopen the last upload after a page reload
if (location.hash.length > 1) start(location.hash.slice(1));
</script>
</body>
</html>
