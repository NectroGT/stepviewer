# Publishes the site/ folder to GitHub Pages whenever it changes on main.
# Requires: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs: "build" packages site/ once, "deploy" publishes that package. If publishing fails,
# "Re-run failed jobs" repeats only the deploy job and reuses the package. (With one job, a re-run
# packages the site a second time and the publish step refuses to choose between the two copies.)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
